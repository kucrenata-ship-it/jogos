<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pênalti do Timão</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

<h1>🦅 Pênalti do Timão ⚽</h1>

<p>Escolha um jogador e tente marcar o gol!</p>

</header>

<div class="campo">

<div class="placar">

<h2>Placar</h2>

<p>⚽ Gols: <span id="gols">0</span></p>

<p>🧤 Defesas: <span id="defesas">0</span></p>

</div>

<div class="gol">

<div id="goleiro">🧤</div>

<div id="bola">⚽</div>

</div>

</div>

<div class="menu">

<h2>Escolha o jogador</h2>

<select id="jogador">

<option>Yuri Alberto</option>

<option>Rodrigo Garro</option>

<option>Romero</option>

<option>Coronado</option>

<option>Talles Magno</option>

<option>Héctor Hernández</option>

</select>

<h2>Escolha onde bater</h2>

<div class="botoes">

<button onclick="bater('esquerda')">⬅ Esquerda</button>

<button onclick="bater('meio')">⬆ Meio</button>

<button onclick="bater('direita')">➡ Direita</button>

</div>

</div>

<div id="resultado">

Escolha um jogador e chute!

</div>

<script src="script.js"></script>

</body>

</html>
